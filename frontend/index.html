<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Microservices Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2.5rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; }
  button { padding: 6px 14px; border: none; border-radius: 4px; background: #2563eb; color: white; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  #userMsg, #orderMsg { font-size: 0.85rem; margin-top: 6px; }
  .error { color: #b91c1c; }
  .success { color: #15803d; }
  .config { font-size: 0.8rem; color: #666; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Microservices Demo</h1>
<p class="config">Users API: <span id="pyUrl"></span> &nbsp;|&nbsp; Orders API: <span id="nodeUrl"></span></p>

<h2>Users (Python + PostgreSQL)</h2>
<form id="userForm">
  <input id="userName" placeholder="Name" required />
  <input id="userEmail" placeholder="Email" type="email" required />
  <button type="submit">Create User</button>
</form>
<div id="userMsg"></div>
<table id="usersTable">
  <thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead>
  <tbody></tbody>
</table>

<h2>Orders (Node + MySQL, linked to Users service)</h2>
<form id="orderForm">
  <input id="orderUserId" placeholder="User ID" type="number" required />
  <input id="orderItem" placeholder="Item" required />
  <input id="orderQty" placeholder="Quantity" type="number" min="1" value="1" required />
  <button type="submit">Create Order</button>
</form>
<div id="orderMsg"></div>
<table id="ordersTable">
  <thead><tr><th>ID</th><th>User ID</th><th>Item</th><th>Qty</th></tr></thead>
  <tbody></tbody>
</table>

<script>
  // The browser calls the services directly on their exposed ports.
  // Adjust these if your ports differ, or if you're serving this page from
  // somewhere other than the same host as the two APIs.
  const PY_URL = `http://${window.location.hostname}:8000`;
  const NODE_URL = `http://${window.location.hostname}:3000`;

  document.getElementById("pyUrl").textContent = PY_URL;
  document.getElementById("nodeUrl").textContent = NODE_URL;

  async function loadUsers() {
    const tbody = document.querySelector("#usersTable tbody");
    tbody.innerHTML = "";
    try {
      const res = await fetch(`${PY_URL}/users`);
      const users = await res.json();
      users.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${u.id}</td><td>${u.name}</td><td>${u.email}</td>`;
        tbody.appendChild(tr);
      });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="3" class="error">Could not load users: ${e.message}</td></tr>`;
    }
  }

  async function loadOrders() {
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";
    try {
      const res = await fetch(`${NODE_URL}/orders`);
      const orders = await res.json();
      orders.forEach(o => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${o.id}</td><td>${o.user_id}</td><td>${o.item}</td><td>${o.quantity}</td>`;
        tbody.appendChild(tr);
      });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="4" class="error">Could not load orders: ${e.message}</td></tr>`;
    }
  }

  document.getElementById("userForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("userMsg");
    msg.textContent = "";
    const name = document.getElementById("userName").value;
    const email = document.getElementById("userEmail").value;
    try {
      const res = await fetch(`${PY_URL}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Failed to create user");
      msg.textContent = `Created user #${data.id}`;
      msg.className = "success";
      e.target.reset();
      loadUsers();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "error";
    }
  });

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("orderMsg");
    msg.textContent = "";
    const user_id = Number(document.getElementById("orderUserId").value);
    const item = document.getElementById("orderItem").value;
    const quantity = Number(document.getElementById("orderQty").value);
    try {
      const res = await fetch(`${NODE_URL}/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id, item, quantity }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to create order");
      msg.textContent = `Created order #${data.id}`;
      msg.className = "success";
      e.target.reset();
      loadOrders();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "error";
    }
  });

  loadUsers();
  loadOrders();
</script>

</body>
</html>
