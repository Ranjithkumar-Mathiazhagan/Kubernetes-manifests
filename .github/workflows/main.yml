name : build image and pushed into docker hub
on :
 workflow_dispatch:
jobs:
 build_python_service:
  runs-on: ubuntu-latest
  steps: 
   - uses: actions/checkout@v4

   - name : login into dockerhub
     uses: docker/login-action@v3
     with :
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}
   -  name: Build and push
      uses: docker/build-push-action@v7
      with:
       context: ./python-service
       push: true
       tags: ranjithvoc32022/users-service:latest
  
 build_node_service:
   runs-on: ubuntu-latest
   steps: 
    - uses: actions/checkout@v4

    - name : login into dockerhub
      uses: docker/login-action@v3
      with :
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}
    -  name: Build and push
       uses: docker/build-push-action@v7
       with:
        context: ./node-service
        push: true
        tags: ranjithvoc32022/orders-service:latest
        
 frontend_service:
   runs-on: ubuntu-latest
   steps: 
    - uses: actions/checkout@v4

    - name : login into dockerhub
      uses: docker/login-action@v3
      with :
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
       context: ./frontend
       push: true
       tags: ranjithvoc32022/frontend:latest
 
  
 
